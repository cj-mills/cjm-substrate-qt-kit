[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-substrate-qt-kit"
dynamic = ["version"]
description = "The ONE Qt foundation library for the cjm-substrate application lane (ruling 8b7351e4): the design-system runtime (tokens from cjm-design-system resolved by ONE Theme into fonts, QPalette, QSS and Lucide icons with ONE change signal), the app shell (window frame, modal frame, keymap menus, job seat, launch resolution, session-key adoption) and the chrome every app shares. Requires ffmpeg on PATH for span playback. Born on-graph."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['PySide6', 'cjm-design-system>=0.0.1', 'cjm-harness-transcripts>=0.0.2']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-substrate-qt-kit"

[tool.setuptools.dynamic]
version = {attr = "cjm_substrate_qt_kit.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_substrate_qt_kit*"]

[tool.setuptools.package-data]
cjm_substrate_qt_kit = ["qss/*.qss", "icons/*.svg", "icons/LICENSE", "systems/*/qss/*.qss"]
