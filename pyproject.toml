[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-substrate-qt-kit"
version = "0.0.4"
description = "Shared foundations for the PySide6 application lane (DEC c4b0d6e5): the loop-thread session base (a private asyncio loop behind a Qt shell), the row-style palette, the keybinding helper, the semantic theme layer, the KeymapRegistry verb table, and the find-bar universal — extracted at their first real duplication (or first claimant), never speculatively. Born on-graph."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['PySide6']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-substrate-qt-kit"

[tool.setuptools.packages.find]
include = ["cjm_substrate_qt_kit*"]
